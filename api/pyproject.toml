[project]
name = "ideacheck-api"
version = "0.1.0"
description = "Idea validation API: parallel research fan-out + LLM judge"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy[asyncio]>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3.6",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-postgres>=2.0",
    "langchain-perplexity>=1.4.0",
    "langchain-anthropic>=1.5.3",
    "python-dotenv>=1.2.2",
    "langchain-openai>=1.4.2",
    "pyjwt[crypto]>=2.10",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "pytest-asyncio>=0.24",
    "httpx>=0.28",
    "ruff>=0.8",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
# `make test` runs `-m "not live"`. The live suite costs real money and is what
# pins the Perplexity response shape the fakes only assume — run it before
# shipping, not on every save.
markers = ["live: hits the real Perplexity and Anthropic APIs (costs money)"]
